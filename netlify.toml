# ═══════════════════════════════════════════════════════
#  FIZI TELECOM — netlify.toml
#  Handles: SPA routing, security headers, admin protection,
#           build config, and environment-aware redirects
# ═══════════════════════════════════════════════════════

# ── Build settings ────────────────────────────────────
[build]
  base    = "frontend"
  publish = "frontend/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION  = "9"

# ── Dev server (netlify dev) ──────────────────────────
[dev]
  command   = "npm run dev"
  port      = 5501
  targetPort = 5501
  framework = "vite"

# ═══════════════════════════════════════════════════════
#  REDIRECTS
# ═══════════════════════════════════════════════════════

# 0. Force non-www and HTTPS
[[redirects]]
  from = "https://www.fizitelecom.com/*"
  to = "https://fizitelecom.com/:splat"
  status = 301
  force = true

# 1. Proxy all /api/* calls to the live backend
#    Set VITE_API_BASE_URL in Netlify env vars to your
#    deployed backend URL (e.g. Render / Railway / fly.io)
[[redirects]]
  from   = "/api/*"
  to     = ":VITE_API_BASE_URL/api/:splat"
  status = 200
  force  = true

# 2. Block direct access to sensitive backend paths
[[redirects]]
  from   = "/.env"
  to     = "/404"
  status = 404
  force  = true

[[redirects]]
  from   = "/server/*"
  to     = "/404"
  status = 404
  force  = true

# 3. SPA catch-all — must be LAST
#    React Router handles all client-side navigation
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ═══════════════════════════════════════════════════════
#  SECURITY HEADERS (applied to all routes)
# ═══════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions policy — disable unused browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # Content Security Policy
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https: http:;
      connect-src 'self' https: wss:;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    """

    # HSTS — force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── Extra hardening for /admin routes ─────────────────
[[headers]]
  for = "/admin*"
  [headers.values]
    # Prevent search engines from indexing admin pages
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

    # Stricter CSP for admin (no CDN scripts except trusted)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https:;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    """

    # Cache-Control: never cache admin pages
    Cache-Control = "no-store, no-cache, must-revalidate, private"

# ── Static assets — aggressive caching ────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML — short cache with revalidation ──────────────
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Fonts ─────────────────────────────────────────────
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
