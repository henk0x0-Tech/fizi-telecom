<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 10 565 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bfff" />
      <stop offset="30%" stop-color="#0057d9" />
      <stop offset="100%" stop-color="#001a4d" />
    </linearGradient>
    
    <linearGradient id="swooshCombined" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001a4d" />
      <stop offset="30%" stop-color="#0057d9" />
      <stop offset="60%" stop-color="#ff4500" />
      <stop offset="100%" stop-color="#ff8c00" />
    </linearGradient>
  </defs>

  <!-- Solid White Background Badge -->
  <rect x="110" y="10" width="565" height="400" fill="#ffffff" rx="30" />

  <!-- GLOBE GROUP -->
  <g transform="translate(0, 15)">
    <!-- ORBIT SWOOSH (Back part) -->
    <path d="M 260 70 Q 380 30 500 90" fill="none" stroke="#ff6600" stroke-width="4" stroke-linecap="round" opacity="0.3" />

    <!-- GLOBE -->
    <circle cx="380" cy="85" r="55" fill="url(#globeGrad)" />
    
    <!-- GLOBE GRID / NETWORK -->
    <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3">
      <ellipse cx="380" cy="85" rx="25" ry="55" />
      <ellipse cx="380" cy="85" rx="55" ry="25" />
    </g>

    <!-- NETWORK NODES & CONNECTIONS -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <line x1="365" y1="50" x2="395" y2="70" />
      <line x1="395" y1="70" x2="415" y2="100" />
      <line x1="395" y1="70" x2="375" y2="110" />
      <line x1="375" y1="110" x2="345" y2="95" />
      <line x1="345" y1="95" x2="365" y2="50" />
      <line x1="415" y1="100" x2="390" y2="125" />
      <line x1="375" y1="110" x2="390" y2="125" />
    </g>
    <g fill="#ffffff">
      <circle cx="365" cy="50" r="4.5" />
      <circle cx="395" cy="70" r="5" />
      <circle cx="415" cy="100" r="4" />
      <circle cx="375" cy="110" r="4.5" />
      <circle cx="345" cy="95" r="3.5" />
      <circle cx="390" cy="125" r="3.5" />
    </g>
    
    <!-- ORBIT SWOOSH (Front part) -->
    <path d="M 230 100 C 310 175, 450 165, 550 50 C 470 115, 340 135, 230 95 Z" fill="url(#swooshCombined)" />
  </g>

  <!-- TEXT "FIZI" (Using custom path mimicking slanted heavy sans-serif) -->
  <g transform="skewX(-20)" fill="#001a4d" stroke="#001a4d" stroke-width="2" stroke-linejoin="round">
    <!-- F -->
    <rect x="320" y="190" width="30" height="90" rx="1" />
    <rect x="350" y="190" width="60" height="28" rx="1" />
    <rect x="350" y="232" width="45" height="25" rx="1" />
    
    <!-- I -->
    <rect x="430" y="190" width="30" height="90" rx="1" />
    
    <!-- Z -->
    <polygon points="480,190 570,190 570,218 515,252 570,252 570,280 480,280 480,252 535,218 480,218" />
    
    <!-- i stem -->
    <rect x="590" y="225" width="30" height="55" rx="1" />
    
    <!-- i dot (Orange) -->
    <polygon points="590,190 620,185 620,210 590,215" fill="#ff6600" stroke="#ff6600" />
  </g>

  <!-- "TELECOM" -->
  <text x="380" y="335" font-family="'Arial Black', 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="900" font-size="28" fill="#ff6600" text-anchor="middle" letter-spacing="18">TELECOM</text>

  <!-- Lines surrounding TELECOM -->
  <line x1="150" y1="325" x2="220" y2="325" stroke="#ff6600" stroke-width="2" />
  <line x1="565" y1="325" x2="635" y2="325" stroke="#ff6600" stroke-width="2" />

  <!-- Tagline -->
  <text x="380" y="370" font-family="'Inter', 'Arial', sans-serif" font-weight="600" font-size="12" fill="#001a4d" text-anchor="middle" letter-spacing="1">CONNECTING TODAY, EMPOWERING TOMORROW</text>

  <!-- Lines surrounding Tagline -->
  <line x1="170" y1="366" x2="200" y2="366" stroke="#001a4d" stroke-width="1.5" />
  <line x1="560" y1="366" x2="590" y2="366" stroke="#001a4d" stroke-width="1.5" />

</svg>
